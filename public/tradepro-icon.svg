<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Dark Metallic Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282B33" />
      <stop offset="45%" stop-color="#17191E" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- Top-Left Subtle Warm Shimmer -->
    <radialGradient id="goldShimmer" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.36" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Border Gradient: Specular top edge for high definition on light surfaces -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#646B7C" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#30343F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#15171C" stop-opacity="0.9" />
    </linearGradient>

    <!-- Rich Gold Arrow Gradient -->
    <linearGradient id="arrowGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49E24" />
      <stop offset="50%" stop-color="#E5B83B" />
      <stop offset="100%" stop-color="#F7D065" />
    </linearGradient>

    <!-- Arrow Drop Shadow for Depth -->
    <filter id="arrowShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Soft Light-Background Ambient Elevation Shadow -->
    <filter id="iconSquircleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111C2E" flood-opacity="0.16" />
    </filter>
  </defs>

  <g filter="url(#iconSquircleShadow)">
    <!-- Squircle Base with Soft Shadow -->
    <rect x="6" y="6" width="88" height="88" rx="23" fill="url(#squircleBg)" stroke="url(#squircleBorder)" stroke-width="1.5" />
    
    <!-- Warm Gold Lighting Shimmer -->
    <rect x="6" y="6" width="88" height="88" rx="23" fill="url(#goldShimmer)" />

    <!-- The Golden Ascending Arrow (45° NE) with Rounded Caps -->
    <g filter="url(#arrowShadow)">
      <!-- Arrowhead: Horizontal top bar & Vertical right bar -->
      <path 
        d="M 44 32 L 68 32 L 68 56" 
        stroke="url(#arrowGold)" 
        stroke-width="10.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
      />
      <!-- Arrow Stem: Diagonal from bottom-left to arrowhead corner -->
      <path 
        d="M 33 67 L 66 34" 
        stroke="url(#arrowGold)" 
        stroke-width="10.5" 
        stroke-linecap="round" 
        fill="none" 
      />
    </g>
  </g>
</svg>
