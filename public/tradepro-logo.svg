<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" width="200" height="52" fill="none">
  <defs>
    <!-- Dark Metallic Squircle Gradient -->
    <linearGradient id="logoSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282B33" />
      <stop offset="45%" stop-color="#17191E" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- Warm Shimmer -->
    <radialGradient id="logoGoldShimmer" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Border: Specular top edge for light backgrounds -->
    <linearGradient id="logoSquircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#646B7C" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#30343F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#15171C" stop-opacity="0.9" />
    </linearGradient>

    <!-- Rich Gold Arrow -->
    <linearGradient id="logoArrowGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49E24" />
      <stop offset="50%" stop-color="#E5B83B" />
      <stop offset="100%" stop-color="#F7D065" />
    </linearGradient>

    <!-- Soft Light-Background Ambient Elevation Shadow -->
    <filter id="logoSquircleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#111C2E" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Left: Squircle Icon (38x38) with soft elevation -->
  <g transform="translate(2, 6)" filter="url(#logoSquircleShadow)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#logoSquircleBg)" stroke="url(#logoSquircleBorder)" stroke-width="1" />
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#logoGoldShimmer)" />
    <!-- Arrow scaled from 100x100 to 38x38 -->
    <g transform="scale(0.38)">
      <path 
        d="M 44 32 L 68 32 L 68 56" 
        stroke="url(#logoArrowGold)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
      />
      <path 
        d="M 33 67 L 66 34" 
        stroke="url(#logoArrowGold)" 
        stroke-width="10" 
        stroke-linecap="round" 
        fill="none" 
      />
    </g>
  </g>

  <!-- Right: Luxury Serif Wordmark "TRADEPRO" (Deep Obsidian Navy for Light Background) -->
  <text 
    x="48" 
    y="28" 
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
    font-size="19" 
    font-weight="700" 
    letter-spacing="3.4px" 
    fill="#111C2E"
  >
    TRADEPRO
  </text>

  <!-- Tagline: "TRADE. ANALYZE. GROW." (High-Contrast Navy with Gold Dots) -->
  <text 
    x="49" 
    y="42" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="8" 
    font-weight="700" 
    letter-spacing="1.8px" 
    fill="#48566A"
  >
    TRADE<tspan fill="#B88E1F">.</tspan> ANALYZE<tspan fill="#B88E1F">.</tspan> GROW<tspan fill="#B88E1F">.</tspan>
  </text>
</svg>
