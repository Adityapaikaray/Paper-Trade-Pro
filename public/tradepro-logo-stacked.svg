<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Dark Background -->
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#15171C" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Dark Metallic Squircle Gradient -->
    <linearGradient id="stSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282B33" />
      <stop offset="45%" stop-color="#17191E" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- Top-Left Subtle Warm Shimmer -->
    <radialGradient id="stGoldShimmer" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="stSquircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555A68" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#2D3039" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#15171C" stop-opacity="0.8" />
    </linearGradient>

    <!-- Rich Gold Arrow Gradient -->
    <linearGradient id="stArrowGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49E24" />
      <stop offset="50%" stop-color="#E5B83B" />
      <stop offset="100%" stop-color="#F7D065" />
    </linearGradient>

    <!-- Drop Shadow for Squircle -->
    <filter id="squircleDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Arrow Drop Shadow -->
    <filter id="stArrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="500" height="500" fill="url(#stageGlow)" />

  <!-- The Squircle Icon -->
  <g transform="translate(135, 100)" filter="url(#squircleDropShadow)">
    <rect x="0" y="0" width="230" height="230" rx="60" fill="url(#stSquircleBg)" stroke="url(#stSquircleBorder)" stroke-width="2" />
    <rect x="0" y="0" width="230" height="230" rx="60" fill="url(#stGoldShimmer)" />

    <!-- Centered Golden Arrow -->
    <g transform="translate(15, 15) scale(2)" filter="url(#stArrowShadow)">
      <!-- Arrowhead -->
      <path 
        d="M 44 32 L 68 32 L 68 56" 
        stroke="url(#stArrowGold)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
      />
      <!-- Stem -->
      <path 
        d="M 33 67 L 66 34" 
        stroke="url(#stArrowGold)" 
        stroke-width="11" 
        stroke-linecap="round" 
        fill="none" 
      />
    </g>
  </g>

  <!-- TRADEPRO Wordmark (Elegant Serif) -->
  <text 
    x="250" 
    y="405" 
    text-anchor="middle" 
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
    font-size="34" 
    font-weight="700" 
    letter-spacing="12px" 
    fill="#DDE2EB"
  >
    TRADEPRO
  </text>
</svg>
