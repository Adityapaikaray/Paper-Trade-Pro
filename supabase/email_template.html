<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your TradePro verification code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #060A13; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #E6EDF3;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #060A13; padding: 40px 16px;">
    <tr>
      <td align="center">
        <!-- Main Card Container -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 480px; background-color: #0D1526; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
          
          <!-- Top Gold Accent Bar -->
          <tr>
            <td style="height: 4px; background: linear-gradient(90deg, #997B1A, #D4AF37, #997B1A);"></td>
          </tr>

          <!-- Header / Brand -->
          <tr>
            <td style="padding: 36px 32px 20px 32px; text-align: center;">
              <span style="font-family: Georgia, serif; font-size: 26px; font-weight: 900; letter-spacing: 2px; color: #D4AF37; text-transform: uppercase;">
                TRADEPRO
              </span>
              <p style="margin: 6px 0 0 0; font-size: 11px; letter-spacing: 1.5px; color: #8B949E; text-transform: uppercase;">
                Institutional Wealth &amp; Trading
              </p>
            </td>
          </tr>

          <!-- Message Body -->
          <tr>
            <td style="padding: 0 32px 24px 32px; text-align: center;">
              <p style="margin: 0 0 16px 0; font-size: 16px; color: #C9D1D9; line-height: 1.5;">
                Verify your email to continue signing in.
              </p>
              
              <p style="margin: 0 0 12px 0; font-size: 13px; color: #8B949E; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">
                Your verification code:
              </p>

              <!-- 6-digit OTP Display Box -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center">
                    <div style="display: inline-block; background-color: #060A13; border: 1px solid #D4AF37; border-radius: 12px; padding: 16px 32px; margin: 8px 0 20px 0;">
                      <span style="font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #FFFFFF;">
                        {{ .Token }}
                      </span>
                    </div>
                  </td>
                </tr>
              </table>

              <p style="margin: 0 0 16px 0; font-size: 13px; color: #8B949E;">
                This code expires shortly.
              </p>

              <p style="margin: 0; font-size: 12px; color: #6E7681; line-height: 1.5;">
                If you did not request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 32px;">
              <div style="height: 1px; background-color: rgba(255, 255, 255, 0.08);"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 32px; text-align: center;">
              <p style="margin: 0 0 4px 0; font-size: 13px; font-weight: 700; color: #D4AF37;">
                TradePro
              </p>
              <p style="margin: 0; font-size: 11px; color: #484F58;">
                Secured by Supabase Auth &bull; 256-Bit TLS Encryption
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
